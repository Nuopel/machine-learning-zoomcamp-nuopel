[project]
name = "aurora-kp-forecast"
version = "0.1.0"
description = "Kp index  pipeline for aurora forecasting, part of capstone 2, DataTalksClub/machine-learning-zoomcamp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "fastparquet>=2025.12.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "onnxscript>=0.5.7",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.5",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "uvicorn>=0.40.0",
    "xgboost>=3.1.3",
]
